name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_CURRENT_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "2.12.2"

jobs:
  test-race:
    name: Race 測試（Go ${{ matrix.go-version }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.12", "1.26.5"]

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 設定 Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: 顯示工具鏈環境
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: 執行 race 測試
        run: make test-race

  portability:
    name: 相容性測試（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 設定 Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 顯示工具鏈環境
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED

      - name: 執行相容性測試
        run: go test -count=1 ./...

  lint:
    name: 靜態分析與格式檢查
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 設定 Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 安裝固定版本 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - name: 驗證格式
        run: make fmt-check

      - name: 執行 go vet
        run: make vet

      - name: 執行 golangci-lint
        run: make lint

  coverage:
    name: 覆蓋率閘門
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 設定 Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 驗證 90% 覆蓋率
        run: make coverage-check

      - name: 上傳覆蓋率至 Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
          version: v11.3.1

  benchmark:
    name: Benchmark 冒煙測試
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 設定 Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_CURRENT_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 執行 benchmark 冒煙測試
        run: make bench
